---
layout: default
---
<section class="py-5">
  <div class="container">
    <div class="row">
      <div class="col-lg-9">
        <h1>{{ page.h1 }}</h1>
        {% if page.lead %}<p class="lead mt-3">{{ page.lead }}</p>{% endif %}
      </div>
    </div>
  </div>
</section>

{% for section in page.sections %}
<section class="py-5 border-top" id="{{ section.id }}">
  <div class="container">
    <h2>{{ section.title }}</h2>
    {% if section.text %}<p>{{ section.text }}</p>{% endif %}
  </div>
</section>
{% endfor %}

{% include project-form.html %}
