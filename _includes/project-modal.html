<div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="projectModalLabel">Обсудить проект</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <p>Расскажите коротко о задаче — свяжемся с вами, чтобы обсудить проект.</p>

        <form action="#" method="post" class="row g-3">
          <div class="col-12">
            <label class="form-label" for="modal-name">Имя</label>
            <input class="form-control" id="modal-name" name="name" type="text" autocomplete="name">
          </div>

          <div class="col-12">
            <label class="form-label" for="modal-contact">Телефон</label>
            <input class="form-control" id="modal-contact" name="contact" type="tel" inputmode="tel" autocomplete="tel" placeholder="+7 (___) ___-__-__" maxlength="18" pattern="\+7 \([0-9]{3}\) [0-9]{3}-[0-9]{2}-[0-9]{2}" title="Введите телефон в формате +7 (999) 999-99-99">
          </div>

          <div class="col-12">
            <label class="form-label" for="modal-message">Коротко о задаче</label>
            <textarea class="form-control" id="modal-message" name="message" rows="4"></textarea>
          </div>

          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="yes" id="modal-personal-data" name="personal_data_consent" required>
              <label class="form-check-label" for="modal-personal-data">
                Согласен на обработку персональных данных
              </label>
            </div>
          </div>

          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="yes" id="modal-privacy-policy" name="privacy_policy_confirmed" required>
              <label class="form-check-label" for="modal-privacy-policy">
                Ознакомлен с политикой конфиденциальности
              </label>
            </div>
          </div>

          <div class="col-12">
            <button class="btn btn-dark" type="submit">Отправить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
