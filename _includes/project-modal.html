<div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="projectModalLabel">Обсудить проект</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <p>Расскажите коротко о задаче — свяжемся с вами, чтобы обсудить проект.</p>

        <form action="#" method="post" class="row g-3">
          <div class="col-12">
            <label class="form-label" for="modal-name">Имя</label>
            <input class="form-control" id="modal-name" name="name" type="text" autocomplete="name">
          </div>

          <div class="col-12">
            <label class="form-label" for="modal-contact">Телефон или мессенджер</label>
            <input class="form-control" id="modal-contact" name="contact" type="text">
          </div>

          <div class="col-12">
            <label class="form-label" for="modal-message">Коротко о задаче</label>
            <textarea class="form-control" id="modal-message" name="message" rows="4"></textarea>
          </div>

          <div class="col-12">
            <button class="btn btn-dark" type="submit">Отправить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
