<section class="py-5" id="project-form">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <h2>Оценить проект</h2>
        <p>Расскажите кратко о задаче. Обработку формы подключим отдельным этапом.</p>
        <form action="#" method="post" class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="name">Имя</label>
            <input class="form-control" id="name" name="name" type="text" autocomplete="name">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="contact">Телефон или email</label>
            <input class="form-control" id="contact" name="contact" type="text" autocomplete="email">
          </div>
          <div class="col-12">
            <label class="form-label" for="message">Задача</label>
            <textarea class="form-control" id="message" name="message" rows="5"></textarea>
          </div>
          <div class="col-12">
            <button class="btn btn-dark" type="submit">Отправить</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
